name: Usage counter files

# Not reusable: runs in this repository only. The counted workflows — the
# Claude-assisted ones (roxygen, tests, analysis scripts) and
# authors-suggest — end with a "Count this run" step (the count-run action)
# that downloads one file from the usage-counter release, named
# <workflow>-<outcome>-<channel>; GitHub counts the downloads per file, so
# each file's download count is a number of runs — from any caller, public
# or private, without sending anything about the caller.
#
# This workflow keeps that release complete: the files for every workflow
# calling count-run, also new ones, with this repository's own token. The
# daily counts are recorded by the private nfdi4health/datashield-kpi-reporting,
# which only reads them (the release is public), so it holds no credential
# for this repository. Design and KPIs: dev-notes/usage-counting.md.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/*.yml']   # a new reusable workflow gets its file at once

concurrency:
  group: usage-counter-files
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: usage-counter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Make sure every counted workflow has its counter file
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --prerelease --latest=false --title "Usage counter" \
              --notes "One file per reusable workflow. Each run of a workflow downloads its file once, so the download counts are the numbers of runs. Nothing about the calling repository is sent. Please don't download these files by hand — it would count as a run."
          fi
          existing="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          # One file per counted workflow (those calling the count-run action
          # in a `uses:` line), outcome and channel — see
          # .github/actions/count-run/count-run.sh.
          wanted=""
          for f in .github/workflows/*.yml; do
            grep -qE '^ *uses: .*/actions/count-run@' "$f" || continue
            workflow="$(basename "$f" .yml)"
            for outcome in proposed nothing failed; do
              for channel in release dev; do
                name="$workflow-$outcome-$channel"
                wanted+="$name"$'\n'
                if grep -qx "$name" <<< "$existing"; then continue; fi
                printf 'Downloaded once per run of %s.yml (%s, %s) to count its runs.\n' "$workflow" "$outcome" "$channel" > "$RUNNER_TEMP/$name"
                gh release upload "$TAG" "$RUNNER_TEMP/$name"
                echo "Added the counter file $name."
              done
            done
          done
          # A file no counted workflow uses any more is removed — only if it
          # was never downloaded, so no count is ever lost.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | "\(.id) \(.name) \(.download_count)"' |
            while read -r id name count; do
              if ! grep -qx "$name" <<< "$wanted" && [ "$count" = "0" ]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
                echo "Removed the unused counter file $name."
              fi
            done

  keepalive:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    uses: ./.github/workflows/workflow-keepalive.yml  # zizmor: ignore[self-repository] (not reusable: always this repository)
