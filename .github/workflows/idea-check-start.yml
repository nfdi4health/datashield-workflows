name: Idea Check Start

# For the hub of missing DataSHIELD functions: a new issue starts the
# "Exists in DataSHIELD?" check in the private runner repository (a
# workflow_dispatch there, idea-check.yml), which runs on the maintainer's
# Claude subscription. Anyone opening an issue starts it; the runner only
# says "look now": it checks the open issues without a check comment, at
# most max-issues per run, each issue once. Started by hand, only listed
# logins may start it.
on:
  workflow_call:
    inputs:
      runner-repository:
        description: 'The runner repository (owner/name) with the idea-check caller.'
        required: true
        type: string
      runner-workflow:
        description: 'The check''s workflow file in the runner.'
        required: false
        type: string
        default: 'idea-check.yml'
      runner-ref:
        description: 'The branch the runner workflow runs on.'
        required: false
        type: string
        default: 'main'
      allowed-logins:
        description: 'Who may start the check by hand (workflow_dispatch): exact GitHub logins, separated by commas or spaces. New issues start it for anyone.'
        required: true
        type: string
    secrets:
      app-client-id:
        description: 'Client ID of the bots'' GitHub App, installed on the runner repository with Actions: read and write.'
        required: true
      app-private-key:
        description: 'Its private key.'
        required: true

jobs:
  start:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: May this login start the check?
        if: github.event_name != 'issues'
        env:
          LOGINS: ${{ inputs.allowed-logins }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          for login in $(tr ',' ' ' <<< "$LOGINS"); do
            [ "$login" = "$ACTOR" ] && exit 0
          done
          echo "::error::$ACTOR may not start the check (allowed-logins)."
          exit 1

      - name: Start the check in the runner
        uses: $/.github/actions/dispatch-runner
        with:
          repository: ${{ inputs.runner-repository }}
          workflow: ${{ inputs.runner-workflow }}
          ref: ${{ inputs.runner-ref }}
          app-client-id: ${{ secrets.app-client-id }}
          app-private-key: ${{ secrets.app-private-key }}
