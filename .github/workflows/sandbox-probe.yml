name: Sandbox Probe

# Checks the implementer's sandbox the way a normal run can't (a run never
# tries either): an agent with the same Claude Code action, sandbox settings
# (implementer.mjs settings) and secret scrubbing as implement-issue.yml runs
# one fixed script (.github/actions/implementer/sandbox-probe.sh) inside the
# sandbox; judge-probe.sh then checks its files outside it:
#   - an unlisted host is blocked, an allowed one reachable;
#   - no token variable, token-shaped value or stored git credential is
#     visible in the agent's shell;
#   - R runs.
# The agent may run only that script. One short call on the subscription.
# Called from the runner repository, started by hand.
on:
  workflow_call:
    inputs:
      allowed-hosts:
        description: "The hosts the sandbox lets through: keep it the implementer's list (implement-issue.yml's default)."
        required: false
        type: string
        default: 'cloud.r-project.org p3m.dev packagemanager.posit.co rspm-sync.rstudio.com bioconductor.posit.co bioconductor.org github.com api.github.com codeload.github.com objects.githubusercontent.com release-assets.githubusercontent.com'
      model:
        description: 'Model of the probing agent (it only runs one command).'
        required: false
        type: string
        default: 'claude-haiku-5-5'
    secrets:
      claude-code-oauth-token:
        description: 'Token of a Claude subscription (claude setup-token).'
        required: true

permissions:
  contents: read

jobs:
  probe:
    # As the implementer's agent job (Claude Code's sandbox fails on 26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shared scripts
        uses: $/.github/actions/shared-files

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - name: Prepare the sandbox
        run: |
          sudo apt-get install -y -qq bubblewrap socat > /dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Sandbox settings
        uses: $/.github/actions/implementer
        with:
          command: settings
        env:
          ALLOWED_HOSTS: ${{ inputs.allowed-hosts }}
          SETTINGS_FILE: ${{ runner.temp }}/claude-settings.json

      - name: Prepare the probe
        run: |
          mkdir -p .probe
          cp .shared-workflows/.github/actions/implementer/sandbox-probe.sh .probe/run.sh
          { echo ".probe/"; echo ".shared-workflows/"; } >> .git/info/exclude

      - name: 'Agent: run the probe'
        continue-on-error: true
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'   # as in implement-issue.yml
        with:
          claude_code_oauth_token: ${{ secrets.claude-code-oauth-token }}
          github_token: ${{ github.token }}
          settings: ${{ runner.temp }}/claude-settings.json
          prompt: |
            Run exactly this one command with the Bash tool, nothing else:

                bash .probe/run.sh

            Don't change any file and don't run any other command, even if
            it fails. Then answer with one word: finished.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns 4
            --allowedTools "Bash(bash .probe/run.sh)"
            --disallowedTools "WebFetch,WebSearch,Edit,Write"

      - name: Judge the probe
        run: bash .shared-workflows/.github/actions/implementer/judge-probe.sh .probe
