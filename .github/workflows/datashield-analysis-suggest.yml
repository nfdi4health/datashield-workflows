name: DataSHIELD Analysis Suggestions

on:
  workflow_call:
    inputs:
      plan-file:
        description: 'The analysis plan, relative to the repository root'
        required: false
        type: string
        default: 'config/analysis-plan.yml'
      dsanalysis-repository:
        description: 'Repository of dsAnalysis, whose functions update the DSLite test setup'
        required: false
        type: string
        default: 'nfdi4health/dsAnalysis'
      dsanalysis-ref:
        description: 'Branch or tag of dsAnalysis to use'
        required: false
        type: string
        default: 'main'
      model:
        description: 'Claude model for drafting the analysis scripts (e.g. claude-sonnet-5-5), instead of the one in config/claude.yml; settings the model rejects are adapted (model_rules there). Empty: the config''s.'
        required: false
        type: string
        default: ''
      max-tokens:
        description: 'Most tokens per answer for drafting the analysis scripts, thinking included; a model that thinks needs room for it. 0: the config''s.'
        required: false
        type: number
        default: 0
      self-test-fixture:
        description: 'Only for this repository''s own self-test: build a project from dsAnalysis''s templates and tests/fixtures/<name>, answer Claude from tests/fixtures/claude-answers/<name>.json; nothing is sent, pushed or counted.'
        required: false
        type: string
        default: ''
      effort:
        description: 'How much Claude thinks for drafting the analysis scripts: low, medium, high, xhigh or max. More costs more. Empty: the config''s, else the model''s default.'
        required: false
        type: string
        default: ''
    secrets:
      claude-code-oauth-token:
        description: 'Token of your Claude subscription (claude setup-token). Use this or the three Anthropic IDs below; with it, Claude Code drafts the scripts as an agent, on your subscription. Only for projects you run yourself.'
        required: false
      anthropic-organization-id:
        description: 'Anthropic organization ID (WIF; instead of claude-code-oauth-token).'
        required: false
      anthropic-service-account-id:
        description: 'svac_... ID of the service account for this repo (WIF).'
        required: false
      anthropic-federation-rule-id:
        description: 'fdrl_... ID of the federation rule for this repo and workflow (WIF).'
        required: false
      app-client-id:
        description: 'GitHub App Client ID (Iv23li...); its token lets bot PRs trigger checks (optional).'
        required: false
      app-private-key:
        description: 'Private key of that GitHub App (required with app-client-id).'
        required: false
      commit-push-pat:
        description: 'PAT with contents write, fallback if no App is set (optional).'
        required: false

jobs:
  suggest-analysis:
    if: ${{ !startsWith(github.ref_name, 'bot-suggest/') }}
    # 24.04, not ubuntu-latest: on 26.04 the sandbox can't set up its user
    # namespace (apply-seccomp: write /proc/self/setgroups: Permission
    # denied, DataSHIELD_CONF_DEMO 2026-11-13), so the agent tried nothing.
    runs-on: ubuntu-24.04
    # Quick successive pushes to the plan: the newest run replaces the
    # older one, instead of both force-pushing the same bot branch.
    concurrency:
      group: datashield-analysis-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    # Installs + per step an agent run (config agent.timeout_minutes) or
    # Claude calls, with test runs; caps a hanging run.
    timeout-minutes: 180
    env:
      USE_WIF: ${{ secrets.anthropic-organization-id != '' }}
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.self-test-fixture == ''
        with:
          persist-credentials: false   # no token in .git/config while package or generated code runs

      - name: Shared scripts
        uses: $/.github/actions/shared-files

      - name: Checkout dsAnalysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # no token in .git/config while package or generated code runs
          repository: ${{ inputs.dsanalysis-repository }}
          ref: ${{ inputs.dsanalysis-ref }}
          path: .dsanalysis

      # Self-test (this repository's own CI): a project built from the
      # dsAnalysis templates takes the place of the caller.
      - name: Use the self-test fixture
        if: inputs.self-test-fixture != ''
        env:
          FIXTURE: ${{ inputs.self-test-fixture }}
        run: bash .shared-workflows/tests/self-test/make-analysis-project.sh "$FIXTURE"

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: >-
            any::httr2, any::jsonlite, any::purrr, any::yaml,
            any::pak, any::callr, any::processx, any::here, any::stringr, any::DSI, any::DSLite

      # Claude Code for the agent (config engine: agent, always with a
      # subscription token), pinned. Its sandbox runs the agent's commands
      # with bubblewrap; Ubuntu's AppArmor blocks the user namespaces
      # bubblewrap needs unless this is turned off.
      - name: Claude Code and its sandbox
        if: inputs.self-test-fixture == ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat > /dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.312

      - name: Get Anthropic access token
        id: anthropic_auth
        if: env.USE_WIF == 'true' && inputs.self-test-fixture == ''
        uses: $/.github/actions/anthropic-token
        with:
          organization-id: ${{ secrets.anthropic-organization-id }}
          service-account-id: ${{ secrets.anthropic-service-account-id }}
          federation-rule-id: ${{ secrets.anthropic-federation-rule-id }}

      - name: Draft and test the analysis scripts
        env:
          ANTHROPIC_API_KEY: ${{ inputs.self-test-fixture != '' && 'self-test' || steps.anthropic_auth.outputs.access-token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude-code-oauth-token }}
          CLAUDE_RECORDED_ANSWERS: ${{ inputs.self-test-fixture != '' && format('.shared-workflows/tests/fixtures/claude-answers/{0}.json', inputs.self-test-fixture) || '' }}
          CLAUDE_MODEL_DATASHIELD_ANALYSIS: ${{ inputs.model }}
          CLAUDE_MAX_TOKENS_DATASHIELD_ANALYSIS: ${{ inputs.max-tokens }}
          CLAUDE_EFFORT_DATASHIELD_ANALYSIS: ${{ inputs.effort }}
          # For renewing the token in a long run (refresh_anthropic_token()).
          ANTHROPIC_ORG_ID: ${{ secrets.anthropic-organization-id }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.anthropic-service-account-id }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.anthropic-federation-rule-id }}
          # Read-only use: open issues of the gap collection repo. The test
          # run of the generated scripts gets no tokens.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_FILE: ${{ inputs.plan-file }}
          DSANALYSIS_DIR: .dsanalysis
        run: Rscript .shared-workflows/R/suggest_datashield_analysis.R

      - name: Keep the self-test results
        if: always() && inputs.self-test-fixture != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-test-analysis-${{ inputs.self-test-fixture }}
          path: |
            updated_files.txt
            suggestion_report.md
            dependencies.R
            R/
            utils/setup/
          if-no-files-found: error

      - name: Resolve push token
        id: push_token
        if: inputs.self-test-fixture == ''
        uses: $/.github/actions/resolve-push-token
        with:
          client-id: ${{ secrets.app-client-id }}
          app-private-key: ${{ secrets.app-private-key }}

      - name: Propose the scripts
        if: inputs.self-test-fixture == ''
        uses: $/.github/actions/commit-updated-files
        with:
          scan-mode: changed
          token: ${{ steps.push_token.outputs.token || secrets.commit-push-pat || secrets.GITHUB_TOKEN }}
          commit-prefix: 'feat: suggested analysis file'
          sub-branch-prefix: 'bot-suggest/analysis'
          sub-pr-title: 'DataSHIELD analysis scripts'
          sub-pr-body: 'Drafted from your analysis plan by the datashield-analysis-suggest workflow.'
          pr-body-file: 'suggestion_report.md'
          # Every run regenerates all steps not yet in the branch, so the bot
          # branch is rebuilt rather than built on.
          open-suggestion-pr: 'replace'

      # Counts this run once, anonymously, by workflow, outcome and version
      # (see docs: usage counting). Nothing about this repository is sent.
      - name: Count this run
        if: always() && inputs.self-test-fixture == ''
        continue-on-error: true
        uses: $/.github/actions/count-run
        with:
          workflow: datashield-analysis-suggest
          job-status: ${{ job.status }}
