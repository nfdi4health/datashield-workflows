name: Literature Watch Start

# For the hub of missing DataSHIELD functions: starts the literature watch
# in the private runner repository (a workflow_dispatch there, with field,
# max-papers and the unused report), so it waits in the same queue as the
# implementer: one subscription, one run at a time (decided 2026-11-13).
# Only listed logins may start it. The run reads the hub's fields and
# pushes the data and the report to the hub's data branch; see
# literature-watch.yml.
on:
  workflow_call:
    inputs:
      runner-repository:
        description: 'The runner repository (owner/name) with the literature-watch caller.'
        required: true
        type: string
      runner-workflow:
        description: 'The researcher''s workflow file in the runner.'
        required: false
        type: string
        default: 'literature-watch.yml'
      runner-ref:
        description: 'The branch the runner workflow runs on.'
        required: false
        type: string
        default: 'main'
      field:
        description: 'One field of the hub''s config/literature-watch.yml. Empty: all of them.'
        required: false
        type: string
        default: ''
      max-papers:
        description: 'At most this many papers in this run (e.g. more over a holiday). Empty: papers_per_run of the hub''s config.'
        required: false
        type: string
        default: ''
      report:
        description: 'No longer used (the report goes to the data branch with every run); kept so callers that pass it keep working.'
        required: false
        type: string
        default: 'always'
      allowed-logins:
        description: 'Who may start the literature watch: exact GitHub logins, separated by commas or spaces.'
        required: true
        type: string
    secrets:
      app-client-id:
        description: 'Client ID of the bots'' GitHub App, installed on the runner repository with Actions: read and write.'
        required: true
      app-private-key:
        description: 'Its private key.'
        required: true

jobs:
  start:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: May this login start the literature watch?
        env:
          LOGINS: ${{ inputs.allowed-logins }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          for login in $(tr ',' ' ' <<< "$LOGINS"); do
            [ "$login" = "$ACTOR" ] && exit 0
          done
          echo "::error::$ACTOR may not start the literature watch (allowed-logins)."
          exit 1

      - name: Start the researcher in the runner
        uses: $/.github/actions/dispatch-runner
        with:
          repository: ${{ inputs.runner-repository }}
          workflow: ${{ inputs.runner-workflow }}
          ref: ${{ inputs.runner-ref }}
          app-client-id: ${{ secrets.app-client-id }}
          app-private-key: ${{ secrets.app-private-key }}
          fields: |
            field=${{ inputs.field }}
            max-papers=${{ inputs.max-papers }}
            report=${{ inputs.report }}
