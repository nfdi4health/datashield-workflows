name: Literature Watch

# The researcher of the hub for missing DataSHIELD functions (e.g.
# nfdi4health/datashield-function-ideas; dev-notes/issue-agents.md, "A
# central hub"): which statistical methods epidemiological research uses,
# from PubMed and PMC (NCBI E-utilities, free), to find methods DataSHIELD
# lacks. Called from the private runner repository, nightly and by hand
# (the hub starts it with literature-watch-start.yml), so it shares the
# implementer's queue and the subscription token stays in one place.
#
# Each field of the hub's config/literature-watch.yml gets a random sample
# of target_per_month papers per publication month over years_back years
# (newest first); Sonnet reads each paper's abstract and methods section
# once and lists its methods (R/watch_literature.R, profile
# methods-extraction). The data goes to the hub's data branch after every
# stretch of papers. Then Opus sorts the new method names into the
# vocabulary and checks the methods named often enough against the
# DataSHIELD functions' documentation (R/classify_literature.R). At the
# end of each run the report and progress.csv go to the same branch
# (literature-watch/reports/); no pull request, as a progress report has
# nothing to decide. At
# the subscription's usage limit or after papers_per_run (or max-papers)
# papers the run stops; the next one carries on.
on:
  workflow_call:
    inputs:
      field:
        description: 'One field of the hub''s config/literature-watch.yml. Empty: all of them.'
        required: false
        type: string
        default: ''
      max-papers:
        description: 'At most this many papers in this run. Empty: papers_per_run of the hub''s config.'
        required: false
        type: string
        default: ''
      report:
        description: 'No longer used (the report now goes to the data branch with every run); kept so callers that pass it keep working.'
        required: false
        type: string
        default: 'auto'
      candidates:
        description: 'The candidate pull request to the hub: auto (once the first round is complete, then once a month), always (this run, e.g. to show it early) or never.'
        required: false
        type: string
        default: 'auto'
      hub-repository:
        description: 'The hub (owner/name): its config/literature-watch.yml is read, the data and the report go to its data branch, the candidates to it as a pull request. Empty: the calling repository, nothing pushed.'
        required: false
        type: string
        default: ''
      hub-branch:
        description: 'The hub''s branch its config/literature-watch.yml is read from.'
        required: false
        type: string
        default: 'main'
      data-branch:
        description: 'The hub''s branch for the data.'
        required: false
        type: string
        default: 'data'
      subscription-logins:
        description: 'Who may start a run on the Claude subscription: exact GitHub logins, separated by commas or spaces. Empty: no check (a private runner, where only its owner, its schedule and the hub''s checked start can start runs).'
        required: false
        type: string
        default: ''
    secrets:
      claude-code-oauth-token:
        description: 'Token of a Claude subscription (claude setup-token).'
        required: true
      app-client-id:
        description: 'Client ID of the bots'' GitHub App, installed on the hub (Contents and Pull requests: read and write, Issues: read). Needed with hub-repository.'
        required: false
      app-private-key:
        description: 'Its private key.'
        required: false
      ncbi-api-key:
        description: 'Optional NCBI API key: 10 requests a second instead of 3.'
        required: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: May this login use the subscription?
        if: inputs.subscription-logins != ''
        env:
          LOGINS: ${{ inputs.subscription-logins }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          for login in $(tr ',' ' ' <<< "$LOGINS"); do
            [ "$login" = "$ACTOR" ] && exit 0
          done
          echo "::error::$ACTOR may not start runs on the subscription (subscription-logins)."
          exit 1

      - name: Which repository is the hub
        id: hub
        env:
          HUB: ${{ inputs.hub-repository }}
        run: |
          if [ -n "$HUB" ]; then
            [[ "$HUB" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::hub-repository is not owner/name: $HUB"; exit 1; }
            { echo "repository=$HUB"; echo "owner=${HUB%%/*}"; echo "name=${HUB#*/}"; } >> "$GITHUB_OUTPUT"
          else
            echo "repository=$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
          fi

      # The hub's token, for that repository only: pushing the data branch,
      # reading its issues and proposing the candidates.
      - name: Token for the hub
        id: hub_token
        if: inputs.hub-repository != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ steps.hub.outputs.owner }}
          repositories: ${{ steps.hub.outputs.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read

      # The hub's main branch: its config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.hub.outputs.repository }}
          ref: ${{ inputs.hub-repository != '' && inputs.hub-branch || '' }}
          persist-credentials: false

      # Scripts, config and prompts at the commit of this workflow.
      - name: Shared scripts
        uses: $/.github/actions/shared-files

      - name: The data so far
        env:
          HUB: ${{ inputs.hub-repository }}
          HUB_TOKEN: ${{ steps.hub_token.outputs.token }}
          DATA_BRANCH: ${{ inputs.data-branch }}
        run: |
          bash .shared-workflows/.github/actions/literature-watch/checkout-data.sh
          echo "watch-data/" >> .git/info/exclude

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: any::httr2, any::jsonlite, any::purrr, any::yaml, any::xml2, any::processx, any::openssl

      # The same pinned Claude Code as the other bots; single calls without
      # shell or file tools (the research step may search the web), so no
      # sandbox.
      - name: Claude Code
        run: npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.312  # zizmor: ignore[adhoc-packages] exact version, as in the other bots

      - name: Read
        id: read
        env:
          SCRIPT: .shared-workflows/R/watch_literature.R
          CLASSIFY_SCRIPT: .shared-workflows/R/classify_literature.R
          REPORT_SCRIPT: .shared-workflows/R/report_literature.R
          WATCH_FIELD: ${{ inputs.field }}
          MAX_PAPERS: ${{ inputs.max-papers }}
          HUB_TOKEN: ${{ steps.hub_token.outputs.token }}
          DATA_BRANCH: ${{ inputs.data-branch }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude-code-oauth-token }}
          NCBI_API_KEY: ${{ secrets.ncbi-api-key }}
          # The hub token lasts an hour, the reading up to five and a half:
          # read-loop.sh renews it with the App's key (never given to R).
          HUB: ${{ inputs.hub-repository }}
          APP_CLIENT_ID: ${{ inputs.hub-repository != '' && secrets.app-client-id || '' }}
          APP_PRIVATE_KEY: ${{ inputs.hub-repository != '' && secrets.app-private-key || '' }}
        run: bash .shared-workflows/.github/actions/literature-watch/read-loop.sh

      # A new hub token for the steps after the reading (the first one has
      # run out by now).
      - name: Token for the hub, again
        id: hub_token_after
        if: inputs.hub-repository != '' && inputs.candidates != 'never'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ steps.hub.outputs.owner }}
          repositories: ${{ steps.hub.outputs.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read

      # The methods already tracked by a hub issue (its hidden marker), for
      # the candidates; R gets the list, not the token.
      - name: Tracked ideas
        if: inputs.hub-repository != '' && inputs.candidates != 'never'
        env:
          HUB: ${{ inputs.hub-repository }}
          GH_TOKEN: ${{ steps.hub_token_after.outputs.token }}
        run: bash .shared-workflows/.github/actions/literature-watch/tracked-ideas.sh tracked.json

      - name: Candidates
        id: candidates
        if: steps.read.outcome == 'success' && inputs.candidates != 'never'
        env:
          WATCH_DATA_DIR: watch-data
          WATCH_CANDIDATES: ${{ inputs.candidates }}
          WATCH_TRACKED: tracked.json
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude-code-oauth-token }}
        run: |
          Rscript .shared-workflows/R/candidates_literature.R
          {
            echo "due=$(cat candidates_due.txt)"
            echo "title=$(head -n 1 candidates_title.txt 2>/dev/null)"
            echo "month=$(date -u +%Y-%m)"
          } >> "$GITHUB_OUTPUT"

      # The research step can take a while: one more fresh token.
      - name: Token for the hub, for the pull request
        id: hub_token_pr
        if: steps.candidates.outputs.due == 'yes' && inputs.hub-repository != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ steps.hub.outputs.owner }}
          repositories: ${{ steps.hub.outputs.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Propose the candidates to the hub
        if: steps.candidates.outputs.due == 'yes' && inputs.hub-repository != ''
        uses: $/.github/actions/propose-branch
        with:
          manifest: candidates_files.txt
          branch: bot-suggest/literature-watch/candidates-${{ steps.candidates.outputs.month }}
          base: ${{ inputs.hub-branch }}
          title: ${{ steps.candidates.outputs.title }}
          body-file: candidates_body.md
          commit-message: 'docs: literature watch candidates ${{ steps.candidates.outputs.month }}'
          token: ${{ steps.hub_token_pr.outputs.token }}
          repository: ${{ inputs.hub-repository }}

      - name: Keep the data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: literature-watch-data
          path: |
            watch-data/
            !watch-data/.git/
          if-no-files-found: ignore
          retention-days: 30

      # Counts this run once, anonymously, by workflow, outcome and version
      # (see docs: usage counting). Nothing about this repository is sent.
      - name: Count this run
        if: always()
        continue-on-error: true
        uses: $/.github/actions/count-run
        with:
          workflow: literature-watch
          job-status: ${{ job.status }}
