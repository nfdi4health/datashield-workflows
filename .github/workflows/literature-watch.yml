name: Literature Watch

# The researcher of the hub for missing DataSHIELD functions (e.g.
# nfdi4health/datashield-function-ideas; dev-notes/issue-agents.md, "A
# central hub"): which statistical methods epidemiological research uses,
# from PubMed and PMC (NCBI E-utilities, free), to find methods DataSHIELD
# lacks. Called from the private runner repository, nightly and by hand
# (the hub starts it with literature-watch-start.yml), so it shares the
# implementer's queue and the subscription token stays in one place.
#
# Four jobs, one after the other, handing over through the hub's data
# branch (each with its own hub token, and its own pass or fail):
#   read        each field of the hub's config/literature-watch.yml gets a
#               random sample of target_per_month papers per publication
#               month over years_back years (newest first); Sonnet reads
#               each paper's abstract and methods section once and lists
#               its methods (R/watch_literature.R, profile
#               methods-extraction), pushed after every stretch. Stops at
#               papers_per_run (or max-papers) or the usage limit.
#   vocabulary  Opus sorts the new method names into methods and variants,
#               so one method counts once however papers word it
#               (R/vocabulary_literature.R). Not after a usage limit.
#   candidates  only when due (once the first round is complete, then
#               monthly; or `candidates: always`): every method and variant
#               ranked by use, checked against the DataSHIELD functions
#               down that ranking until enough gaps are found ("Exists in
#               DataSHIELD?"), the gaps researched with web search and
#               proposed to the hub as a pull request
#               (R/candidates_literature.R).
#   report      progress, shares, trends and progress.csv to the data
#               branch (R/report_literature.R), after every run, whatever
#               happened before; no pull request, a progress report has
#               nothing to decide.
on:
  workflow_call:
    inputs:
      field:
        description: 'One field of the hub''s config/literature-watch.yml. Empty: all of them.'
        required: false
        type: string
        default: ''
      max-papers:
        description: 'At most this many papers in this run. Empty: papers_per_run of the hub''s config.'
        required: false
        type: string
        default: ''
      report:
        description: 'No longer used (the report now goes to the data branch with every run); kept so callers that pass it keep working.'
        required: false
        type: string
        default: 'auto'
      candidates:
        description: 'The candidate pull request to the hub: auto (once the first round is complete, then once a month), always (this run, e.g. to show it early) or never.'
        required: false
        type: string
        default: 'auto'
      hub-repository:
        description: 'The hub (owner/name): its config/literature-watch.yml is read, the data and the report go to its data branch, the candidates to it as a pull request. Empty: the calling repository, nothing pushed.'
        required: false
        type: string
        default: ''
      hub-branch:
        description: 'The hub''s branch its config/literature-watch.yml is read from.'
        required: false
        type: string
        default: 'main'
      data-branch:
        description: 'The hub''s branch for the data.'
        required: false
        type: string
        default: 'data'
      subscription-logins:
        description: 'Who may start a run on the Claude subscription: exact GitHub logins, separated by commas or spaces. Empty: no check (a private runner, where only its owner, its schedule and the hub''s checked start can start runs).'
        required: false
        type: string
        default: ''
    secrets:
      claude-code-oauth-token:
        description: 'Token of a Claude subscription (claude setup-token).'
        required: true
      app-client-id:
        description: 'Client ID of the bots'' GitHub App, installed on the hub (Contents and Pull requests: read and write, Issues: read). Needed with hub-repository.'
        required: false
      app-private-key:
        description: 'Its private key.'
        required: false
      ncbi-api-key:
        description: 'Optional NCBI API key: 10 requests a second instead of 3.'
        required: false

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      stopped: ${{ steps.read.outputs.stopped }}
      repository: ${{ steps.hub.outputs.repository }}
      owner: ${{ steps.hub.outputs.owner }}
      name: ${{ steps.hub.outputs.name }}
    steps:
      - name: May this login use the subscription?
        if: inputs.subscription-logins != ''
        env:
          LOGINS: ${{ inputs.subscription-logins }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          for login in $(tr ',' ' ' <<< "$LOGINS"); do
            [ "$login" = "$ACTOR" ] && exit 0
          done
          echo "::error::$ACTOR may not start runs on the subscription (subscription-logins)."
          exit 1

      - name: Which repository is the hub
        id: hub
        env:
          HUB: ${{ inputs.hub-repository }}
        run: |
          if [ -n "$HUB" ]; then
            [[ "$HUB" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::hub-repository is not owner/name: $HUB"; exit 1; }
            { echo "repository=$HUB"; echo "owner=${HUB%%/*}"; echo "name=${HUB#*/}"; } >> "$GITHUB_OUTPUT"
          else
            echo "repository=$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
          fi

      # The hub's token, for that repository only: pushing the data branch.
      # It lasts an hour; read-loop.sh renews it.
      - name: Token for the hub
        id: hub_token
        if: inputs.hub-repository != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ steps.hub.outputs.owner }}
          repositories: ${{ steps.hub.outputs.name }}
          permission-contents: write

      # The hub's main branch: its config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.hub.outputs.repository }}
          ref: ${{ inputs.hub-repository != '' && inputs.hub-branch || '' }}
          persist-credentials: false

      # Scripts, config and prompts at the commit of this workflow.
      - name: Shared scripts
        uses: $/.github/actions/shared-files

      - name: Data, R and Claude Code
        uses: $/.github/actions/literature-watch-setup
        with:
          hub-repository: ${{ inputs.hub-repository }}
          hub-token: ${{ steps.hub_token.outputs.token }}
          data-branch: ${{ inputs.data-branch }}
          first-job: 'true'

      - name: Read
        id: read
        env:
          SCRIPT: .shared-workflows/R/watch_literature.R
          WATCH_FIELD: ${{ inputs.field }}
          MAX_PAPERS: ${{ inputs.max-papers }}
          HUB_TOKEN: ${{ steps.hub_token.outputs.token }}
          DATA_BRANCH: ${{ inputs.data-branch }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude-code-oauth-token }}
          NCBI_API_KEY: ${{ secrets.ncbi-api-key }}
          # The hub token lasts an hour, the reading up to five and a half:
          # read-loop.sh renews it with the App's key (never given to R).
          HUB: ${{ inputs.hub-repository }}
          APP_CLIENT_ID: ${{ inputs.hub-repository != '' && secrets.app-client-id || '' }}
          APP_PRIVATE_KEY: ${{ inputs.hub-repository != '' && secrets.app-private-key || '' }}
        run: bash .shared-workflows/.github/actions/literature-watch/read-loop.sh

      - name: Keep the data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: literature-watch-data
          path: |
            watch-data/
            !watch-data/.git/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30

  vocabulary:
    needs: read
    if: ${{ !cancelled() && needs.read.outputs.repository != '' && needs.read.outputs.stopped != 'limit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      status: ${{ steps.vocabulary.outputs.status }}
    steps:
      - name: Token for the hub
        id: hub_token
        if: inputs.hub-repository != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ needs.read.outputs.owner }}
          repositories: ${{ needs.read.outputs.name }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.read.outputs.repository }}
          ref: ${{ inputs.hub-repository != '' && inputs.hub-branch || '' }}
          persist-credentials: false

      - name: Shared scripts
        uses: $/.github/actions/shared-files

      - name: Data, R and Claude Code
        uses: $/.github/actions/literature-watch-setup
        with:
          hub-repository: ${{ inputs.hub-repository }}
          hub-token: ${{ steps.hub_token.outputs.token }}
          data-branch: ${{ inputs.data-branch }}

      - name: Vocabulary
        id: vocabulary
        env:
          WATCH_DATA_DIR: watch-data
          WATCH_VOCABULARY_STATUS: vocabulary_status.txt
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude-code-oauth-token }}
        run: |
          Rscript .shared-workflows/R/vocabulary_literature.R
          echo "status=$(cat vocabulary_status.txt)" >> "$GITHUB_OUTPUT"

      - name: Push the vocabulary
        env:
          HUB_TOKEN: ${{ steps.hub_token.outputs.token }}
          DATA_BRANCH: ${{ inputs.data-branch }}
        run: bash .shared-workflows/.github/actions/literature-watch/push-data.sh vocabulary

      - name: Keep the data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: literature-watch-data
          path: |
            watch-data/
            !watch-data/.git/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30

  candidates:
    needs: [read, vocabulary]
    if: >-
      ${{ !cancelled() && inputs.candidates != 'never' && needs.vocabulary.result == 'success'
      && needs.vocabulary.outputs.status != 'limit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Token for the hub
        id: hub_token
        if: inputs.hub-repository != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ needs.read.outputs.owner }}
          repositories: ${{ needs.read.outputs.name }}
          permission-contents: write
          permission-issues: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.read.outputs.repository }}
          ref: ${{ inputs.hub-repository != '' && inputs.hub-branch || '' }}
          persist-credentials: false

      - name: Shared scripts
        uses: $/.github/actions/shared-files

      - name: Data, R and Claude Code
        uses: $/.github/actions/literature-watch-setup
        with:
          hub-repository: ${{ inputs.hub-repository }}
          hub-token: ${{ steps.hub_token.outputs.token }}
          data-branch: ${{ inputs.data-branch }}

      # The methods already tracked by a hub issue (its hidden marker); R
      # gets the list, not the token.
      - name: Tracked ideas
        env:
          HUB: ${{ inputs.hub-repository }}
          GH_TOKEN: ${{ steps.hub_token.outputs.token }}
        run: bash .shared-workflows/.github/actions/literature-watch/tracked-ideas.sh tracked.json

      # Ranking, "Exists in DataSHIELD?" down the ranking, research.
      - name: Candidates
        id: candidates
        env:
          WATCH_DATA_DIR: watch-data
          WATCH_CANDIDATES: ${{ inputs.candidates }}
          WATCH_TRACKED: tracked.json
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude-code-oauth-token }}
        run: |
          Rscript .shared-workflows/R/candidates_literature.R
          {
            echo "due=$(cat candidates_due.txt)"
            echo "title=$(head -n 1 candidates_title.txt 2>/dev/null)"
            echo "month=$(date -u +%Y-%m)"
          } >> "$GITHUB_OUTPUT"

      # The verdicts are kept also when nothing is proposed; the research
      # can take a while, so a fresh token.
      - name: Token for the hub, after the research
        id: hub_token_after
        if: ${{ !cancelled() && inputs.hub-repository != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ needs.read.outputs.owner }}
          repositories: ${{ needs.read.outputs.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Push the verdicts
        if: ${{ !cancelled() }}
        env:
          HUB_TOKEN: ${{ steps.hub_token_after.outputs.token }}
          DATA_BRANCH: ${{ inputs.data-branch }}
        run: bash .shared-workflows/.github/actions/literature-watch/push-data.sh "Exists? verdicts"

      - name: Propose the candidates to the hub
        if: steps.candidates.outputs.due == 'yes' && inputs.hub-repository != ''
        uses: $/.github/actions/propose-branch
        with:
          manifest: candidates_files.txt
          branch: bot-suggest/literature-watch/candidates-${{ steps.candidates.outputs.month }}
          base: ${{ inputs.hub-branch }}
          title: ${{ steps.candidates.outputs.title }}
          body-file: candidates_body.md
          commit-message: 'docs: literature watch candidates ${{ steps.candidates.outputs.month }}'
          token: ${{ steps.hub_token_after.outputs.token }}
          repository: ${{ inputs.hub-repository }}

      - name: Keep the data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: literature-watch-data
          path: |
            watch-data/
            !watch-data/.git/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30

  report:
    needs: [read, vocabulary, candidates]
    if: ${{ !cancelled() && needs.read.outputs.repository != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Token for the hub
        id: hub_token
        if: inputs.hub-repository != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ needs.read.outputs.owner }}
          repositories: ${{ needs.read.outputs.name }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.read.outputs.repository }}
          ref: ${{ inputs.hub-repository != '' && inputs.hub-branch || '' }}
          persist-credentials: false

      - name: Shared scripts
        uses: $/.github/actions/shared-files

      - name: Data and R
        uses: $/.github/actions/literature-watch-setup
        with:
          hub-repository: ${{ inputs.hub-repository }}
          hub-token: ${{ steps.hub_token.outputs.token }}
          data-branch: ${{ inputs.data-branch }}
          claude-code: 'false'

      - name: Report
        env:
          WATCH_DATA_DIR: watch-data
        run: Rscript .shared-workflows/R/report_literature.R

      - name: Push the report
        env:
          HUB_TOKEN: ${{ steps.hub_token.outputs.token }}
          DATA_BRANCH: ${{ inputs.data-branch }}
        run: bash .shared-workflows/.github/actions/literature-watch/push-data.sh report

      - name: Keep the data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: literature-watch-data
          path: |
            watch-data/
            !watch-data/.git/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30

      # Counts this run once, anonymously, by workflow, outcome and version
      # (see docs: usage counting). Nothing about this repository is sent.
      - name: Count this run
        if: always()
        continue-on-error: true
        uses: $/.github/actions/count-run
        with:
          workflow: literature-watch
          job-status: ${{ contains(needs.*.result, 'failure') && 'failure' || job.status }}
