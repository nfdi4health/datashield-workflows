name: Literature Watch

# The researcher of the hub for missing DataSHIELD functions (e.g.
# nfdi4health/datashield-function-ideas; dev-notes/issue-agents.md, "A
# central hub"): which statistical methods epidemiological research uses,
# from PubMed and PMC (NCBI E-utilities, free), to find methods DataSHIELD
# lacks. Called from the private runner repository, nightly and by hand
# (the hub starts it with literature-watch-start.yml), so it shares the
# implementer's queue and the subscription token stays in one place.
#
# Each field of the hub's config/literature-watch.yml gets a random sample
# of target_per_month papers per publication month over years_back years
# (newest first); Sonnet reads each paper's abstract and methods section
# once and lists its methods (R/watch_literature.R, profile
# methods-extraction). The data goes to the hub's data branch after every
# stretch of papers (no pull request); the report
# (literature-watch/reports/overview.md) goes to the hub's main branch by
# pull request: weekly, once a round is complete, and when asked for. At
# the subscription's usage limit or after papers_per_run (or max-papers)
# papers the run stops; the next one carries on.
on:
  workflow_call:
    inputs:
      field:
        description: 'One field of the hub''s config/literature-watch.yml. Empty: all of them.'
        required: false
        type: string
        default: ''
      max-papers:
        description: 'At most this many papers in this run. Empty: papers_per_run of the hub''s config.'
        required: false
        type: string
        default: ''
      report:
        description: 'The report pull request: auto (on the config''s report weekday, and once when a round is complete), always or never.'
        required: false
        type: string
        default: 'auto'
      hub-repository:
        description: 'The hub (owner/name): its config/literature-watch.yml is read, the data goes to its data branch and the report to it as a pull request. Empty: the calling repository, nothing pushed.'
        required: false
        type: string
        default: ''
      hub-branch:
        description: 'The hub''s branch the report goes into.'
        required: false
        type: string
        default: 'main'
      data-branch:
        description: 'The hub''s branch for the data.'
        required: false
        type: string
        default: 'data'
      subscription-logins:
        description: 'Who may start a run on the Claude subscription: exact GitHub logins, separated by commas or spaces. Empty: no check (a private runner, where only its owner, its schedule and the hub''s checked start can start runs).'
        required: false
        type: string
        default: ''
    secrets:
      claude-code-oauth-token:
        description: 'Token of a Claude subscription (claude setup-token).'
        required: true
      app-client-id:
        description: 'Client ID of the bots'' GitHub App, installed on the hub (Contents and Pull requests: read and write). Needed with hub-repository.'
        required: false
      app-private-key:
        description: 'Its private key.'
        required: false
      ncbi-api-key:
        description: 'Optional NCBI API key: 10 requests a second instead of 3.'
        required: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: May this login use the subscription?
        if: inputs.subscription-logins != ''
        env:
          LOGINS: ${{ inputs.subscription-logins }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          for login in $(tr ',' ' ' <<< "$LOGINS"); do
            [ "$login" = "$ACTOR" ] && exit 0
          done
          echo "::error::$ACTOR may not start runs on the subscription (subscription-logins)."
          exit 1

      - name: Which repository is the hub
        id: hub
        env:
          HUB: ${{ inputs.hub-repository }}
        run: |
          if [ -n "$HUB" ]; then
            [[ "$HUB" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::hub-repository is not owner/name: $HUB"; exit 1; }
            { echo "repository=$HUB"; echo "owner=${HUB%%/*}"; echo "name=${HUB#*/}"; } >> "$GITHUB_OUTPUT"
          else
            echo "repository=$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
          fi

      # The hub's token, for that repository only: pushing the data branch
      # and proposing the report.
      - name: Token for the hub
        id: hub_token
        if: inputs.hub-repository != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ steps.hub.outputs.owner }}
          repositories: ${{ steps.hub.outputs.name }}
          permission-contents: write
          permission-pull-requests: write

      # The hub's main branch: its config, and the report proposed on top.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.hub.outputs.repository }}
          ref: ${{ inputs.hub-repository != '' && inputs.hub-branch || '' }}
          persist-credentials: false

      # Scripts, config and prompts at the commit of this workflow.
      - name: Shared scripts
        uses: $/.github/actions/shared-files

      - name: The data so far
        env:
          HUB: ${{ inputs.hub-repository }}
          HUB_TOKEN: ${{ steps.hub_token.outputs.token }}
          DATA_BRANCH: ${{ inputs.data-branch }}
        run: |
          bash .shared-workflows/.github/actions/literature-watch/checkout-data.sh
          echo "watch-data/" >> .git/info/exclude

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: any::httr2, any::jsonlite, any::purrr, any::yaml, any::xml2, any::processx, any::openssl

      # The same pinned Claude Code as the other bots; single calls without
      # tools, so no sandbox.
      - name: Claude Code
        run: npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.312  # zizmor: ignore[adhoc-packages] exact version, as in the other bots

      - name: Read
        id: read
        env:
          SCRIPT: .shared-workflows/R/watch_literature.R
          WATCH_FIELD: ${{ inputs.field }}
          MAX_PAPERS: ${{ inputs.max-papers }}
          HUB_TOKEN: ${{ steps.hub_token.outputs.token }}
          DATA_BRANCH: ${{ inputs.data-branch }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude-code-oauth-token }}
          NCBI_API_KEY: ${{ secrets.ncbi-api-key }}
        run: bash .shared-workflows/.github/actions/literature-watch/read-loop.sh

      - name: Build the report
        id: report
        if: always() && steps.read.outcome != 'skipped'
        env:
          WATCH_DATA_DIR: watch-data
          WATCH_REPORT: ${{ inputs.report }}
        run: |
          Rscript .shared-workflows/R/report_literature.R > /dev/null
          {
            echo "due=$(cat report_due.txt)"
            echo "title=$(head -n 1 report_title.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Propose the report to the hub
        if: always() && inputs.hub-repository != '' && steps.report.outputs.due == 'yes'
        uses: $/.github/actions/propose-branch
        with:
          manifest: watch_files.txt
          branch: bot-suggest/literature-watch/report
          base: ${{ inputs.hub-branch }}
          title: ${{ steps.report.outputs.title }}
          body-file: report_body.md
          commit-message: 'docs: literature watch report'
          token: ${{ steps.hub_token.outputs.token }}
          repository: ${{ inputs.hub-repository }}

      - name: Keep the data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: literature-watch-data
          path: |
            watch-data/
            !watch-data/.git/
            literature-watch/reports/overview.md
          if-no-files-found: ignore
          retention-days: 30

      # Counts this run once, anonymously, by workflow, outcome and version
      # (see docs: usage counting). Nothing about this repository is sent.
      - name: Count this run
        if: always()
        continue-on-error: true
        uses: $/.github/actions/count-run
        with:
          workflow: literature-watch
          job-status: ${{ job.status }}
