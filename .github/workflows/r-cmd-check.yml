name: R-CMD-check

on:
  workflow_call:
    inputs:
      os-list:
        description: 'JSON array of runner OSes'
        required: false
        type: string
        default: '["ubuntu-latest"]'
      r-version-list:
        description: 'JSON array of R versions to test'
        required: false
        type: string
        default: '["release", "oldrel-1", "oldrel-2"]'
      run-codecov:
        description: 'Upload coverage to Codecov (first matrix cell only)'
        required: false
        type: boolean
        default: true
      extra-apt-packages:
        description: 'Space-separated apt packages, e.g. "libcurl4-openssl-dev"'
        required: false
        type: string
        default: ''
      extra-r-packages:
        description: 'Comma-separated extra R packages, e.g. "httptest, xml2"'
        required: false
        type: string
        default: ''
      cran-incoming:
        description: 'With as-cran: also run CRAN''s incoming checks (maintainer, new submission, dependencies on CRAN, URLs). Turn off while a dependency is not on CRAN yet: its WARNING would fail every check.'
        required: false
        type: boolean
        default: true
      matrix-exclude:
        description: 'JSON array of os / r-version combinations to leave out, e.g. ''[{"os": "macos-latest", "r-version": "devel"}]'' (no package binaries for R-devel on macOS, so dependencies are built from source and can fail there). Default: none.'
        required: false
        type: string
        default: '[]'
      as-cran:
        description: 'Check the way CRAN does before a submission: with the PDF manual (TinyTeX is installed) and CRAN''s incoming checks (maintainer, spelling of DESCRIPTION, URLs, the new-submission note). Use with an os-list of ubuntu-latest, macos-latest and windows-latest. Notes are shown, not failed: CRAN wants each explained in cran-comments.md.'
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: 'Time limit of each check job. A runner that loses its network (apt or package downloads retrying) then fails instead of hanging for hours.'
        required: false
        type: number
        default: 45
    secrets:
      CODECOV_TOKEN:
        description: 'Codecov token. Optional: without one, a refused upload gives a warning, not a failed check.'
        required: false

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (${{ matrix.r-version }})
    timeout-minutes: ${{ inputs.timeout-minutes }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-list) }}
        r-version: ${{ fromJSON(inputs.r-version-list) }}
        exclude: ${{ fromJSON(inputs.matrix-exclude) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Install extra apt packages
        if: ${{ inputs.extra-apt-packages != '' }}
        env:
          EXTRA_APT_PACKAGES: ${{ inputs.extra-apt-packages }}
        # Word splitting is intended: a space-separated package list.
        run: |
          # shellcheck disable=SC2086
          sudo apt-get update && sudo apt-get install -y $EXTRA_APT_PACKAGES

      - name: Format extra R package list
        id: extra_r_packages
        if: ${{ inputs.extra-r-packages != '' }}
        env:
          EXTRA_R_PACKAGES: ${{ inputs.extra-r-packages }}
        run: |
          formatted=$(echo "$EXTRA_R_PACKAGES" \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | sed '/^$/d' \
            | sed 's/^/any::/' \
            | paste -sd, -)
          echo "list=$formatted" >> "$GITHUB_OUTPUT"

      # CRAN builds the PDF manual, which needs LaTeX.
      - uses: r-lib/actions/setup-tinytex@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: ${{ inputs.as-cran }}

      # TinyTeX is minimal, and R CMD check doesn't install missing LaTeX
      # packages on demand: these are the ones R's Rd.sty uses for the
      # manual (fonts, verbatim, colour). pwsh runs tlmgr on all three
      # systems (tlmgr.bat on Windows).
      - name: LaTeX packages for the PDF manual
        if: ${{ inputs.as-cran }}
        shell: pwsh
        run: tlmgr install inconsolata times helvetic psnfss ec upquote fancyvrb xcolor

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: |
            any::rcmdcheck
            any::covr
            ${{ steps.extra_r_packages.outputs.list }}
          needs: check

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: ${{ !inputs.as-cran }}
        with:
          upload-snapshots: true

      # Like CRAN: with the PDF manual (the action's default skips it) and
      # CRAN's incoming checks (maintainer, spelling, URLs).
      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: ${{ inputs.as-cran }}
        env:
          _R_CHECK_CRAN_INCOMING_: ${{ inputs.cran-incoming && 'true' || 'false' }}
          _R_CHECK_CRAN_INCOMING_REMOTE_: ${{ inputs.cran-incoming && 'true' || 'false' }}
        with:
          upload-snapshots: true
          args: 'c("--as-cran")'

      # R CMD check only says "LaTeX errors found:" without the error; the
      # manual's .tex stays in the check folder, so build it once more and
      # show the end of the LaTeX log.
      - name: Show the LaTeX error of the PDF manual
        if: ${{ failure() && inputs.as-cran }}
        shell: Rscript {0}
        run: |
          tex <- list.files("check", pattern = "-manual\\.tex$", recursive = TRUE, full.names = TRUE)
          if (length(tex) == 0) quit(save = "no")
          setwd(dirname(tex[1]))
          try(tools::texi2pdf(basename(tex[1]), clean = FALSE, quiet = TRUE), silent = TRUE)
          log <- sub("\\.tex$", ".log", basename(tex[1]))
          if (file.exists(log)) {
            lines <- readLines(log, warn = FALSE)
            err <- grep("^!", lines)
            from <- if (length(err)) max(1, err[1] - 5) else max(1, length(lines) - 40)
            writeLines(lines[from:min(length(lines), from + 40)])
          }

      - name: Show testthat output
        if: always()
        run: find ${{ runner.temp }}/package -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Test coverage
        if: ${{ inputs.run-codecov && matrix.os == fromJSON(inputs.os-list)[0] && matrix.r-version == fromJSON(inputs.r-version-list)[0] }}
        shell: Rscript {0}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        # Without a token the upload is optional: Codecov refuses tokenless
        # uploads for most repositories, which then gives a warning, not a
        # failed check. With a token a failed upload still fails it.
        run: |
          token <- Sys.getenv("CODECOV_TOKEN")
          tryCatch(
            covr::codecov(
              quiet = FALSE,
              clean = FALSE,
              token = token,
              install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
            ),
            error = function(e) {
              if (nzchar(token)) stop(e)
              cat(sprintf("::warning title=Coverage not uploaded::Codecov refused the upload without a token (%s). Set the CODECOV_TOKEN secret to upload coverage, or run-codecov: false to skip it.\n",
                gsub("[\r\n]+", " ", conditionMessage(e))))
            }
          )
