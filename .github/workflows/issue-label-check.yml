name: Issue Label Check

# First step of the issue flow (dev-notes/issue-agents.md): keeps the
# approval label honest, so it only stays on an issue if the right person
# set it and the text has not changed since. No Claude, no checkout of the
# calling repository; the logic is in the composite action, which reads
# the event itself, so no issue text passes through an expression.
on:
  workflow_call:
    inputs:
      label:
        description: 'The approval label.'
        required: false
        type: string
        default: 'bot-proceed'
      other-labels:
        description: 'More labels only the listed logins may set, separated by commas. Unlike the approval label, edits do not remove these.'
        required: false
        type: string
        default: 'bot-triage'
      allowed-logins:
        description: 'Who may set the label: exact GitHub logins, separated by commas or spaces. Access level plays no part. Required: no default, so no one is trusted by accident.'
        required: true
        type: string
      runner-repository:
        description: 'The implementer runner repository (owner/name). When set, an approval that stays starts the runner, which works through the approved issues (dev-notes/implementer-plan.md). Empty: no start.'
        required: false
        type: string
        default: ''
      runner-workflow:
        description: 'The runner workflow file.'
        required: false
        type: string
        default: 'implement-issue.yml'
      runner-ref:
        description: 'The branch the runner workflow runs on.'
        required: false
        type: string
        default: 'main'
    secrets:
      dispatch-app-client-id:
        description: 'Client ID of an App installed on the runner repository with Actions: read and write only. Not the App that writes code: its key sits in this repository.'
        required: false
      dispatch-app-private-key:
        description: 'Its private key.'
        required: false
      dispatch-token:
        description: 'Otherwise: a token that may start workflows in the runner repository (Actions: read and write on it, nothing else).'
        required: false

permissions: {}

jobs:
  check-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      approved: ${{ steps.check.outputs.approved }}
    steps:
      - name: Check the approval label
        id: check
        uses: $/.github/actions/issue-label-check
        with:
          label: ${{ inputs.label }}
          other-labels: ${{ inputs.other-labels }}
          allowed-logins: ${{ inputs.allowed-logins }}
          token: ${{ github.token }}

  # Only after the check kept the label. The runner checks the approval
  # again itself, so a start without one does nothing.
  start-runner:
    needs: check-label
    if: needs.check-label.outputs.approved == 'true' && inputs.runner-repository != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Start the implementer
        uses: $/.github/actions/dispatch-runner
        with:
          repository: ${{ inputs.runner-repository }}
          workflow: ${{ inputs.runner-workflow }}
          ref: ${{ inputs.runner-ref }}
          app-client-id: ${{ secrets.dispatch-app-client-id }}
          app-private-key: ${{ secrets.dispatch-app-private-key }}
          token: ${{ secrets.dispatch-token }}
