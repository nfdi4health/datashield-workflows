name: Literature Candidates

# For the hub of missing DataSHIELD functions: the literature watch's
# candidate pull requests (literature-watch.yml proposes them on branches
# bot-suggest/literature-watch/candidates-YYYY-MM). While one is open, the
# check stays red until every candidate has exactly one of its three
# boxes ticked (open an issue, not now, don't suggest again). Once it is
# merged, an idea issue is opened for each "open an issue" (with the
# candidate's brief and a hidden marker, so it isn't proposed again), and
# every decision goes into decisions.json on the data branch, which the
# literature watch reads. No Claude; the logic is in
# .github/actions/literature-candidates/candidates.mjs. The caller runs it
# on pull_request (opened, edited, synchronize, reopened, closed).
on:
  workflow_call:
    inputs:
      branch-prefix:
        description: 'Head branches of candidate pull requests start with this.'
        required: false
        type: string
        default: 'bot-suggest/literature-watch/candidates'
      folder:
        description: 'Where the candidate files are on the merged branch.'
        required: false
        type: string
        default: 'literature-watch/candidates'
      data-branch:
        description: 'The branch the literature watch keeps its data on.'
        required: false
        type: string
        default: 'data'
      decisions-path:
        description: 'The decisions file on the data branch.'
        required: false
        type: string
        default: 'literature-watch/data/decisions.json'
      issue-labels:
        description: 'Labels for the issues opened, separated by commas or spaces.'
        required: false
        type: string
        default: 'literature-watch'

jobs:
  check:
    if: github.event.action != 'closed' && startsWith(github.event.pull_request.head.ref, inputs.branch-prefix)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shared scripts
        uses: $/.github/actions/shared-files
      - name: One box per candidate
        run: node .shared-workflows/.github/actions/literature-candidates/candidates.mjs check

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, inputs.branch-prefix)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shared scripts
        uses: $/.github/actions/shared-files
      - name: Open the issues and record the decisions
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATES_FOLDER: ${{ inputs.folder }}
          DATA_BRANCH: ${{ inputs.data-branch }}
          DECISIONS_PATH: ${{ inputs.decisions-path }}
          ISSUE_LABELS: ${{ inputs.issue-labels }}
        run: node .shared-workflows/.github/actions/literature-candidates/candidates.mjs apply
