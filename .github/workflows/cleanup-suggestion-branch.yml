name: Cleanup Suggestion Branch

on:
  workflow_call:

# Deletes the branch of a closed pull request (merged or not) made by a
# bot or an agent: `bot-suggest/*` (the suggestion workflows) and
# `agent-suggest/*` (coding agents, e.g. agent-suggest/fix/issue-12), unless
# another open pull request still uses it. Only branches of this repository:
# a fork's branch of the same name must not delete ours.
jobs:
  cleanup:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'bot-suggest/') ||
      startsWith(github.event.pull_request.head.ref, 'agent-suggest/')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete the suggestion branch
        # The branch name through the environment, never written into the
        # script itself (a crafted name could otherwise run as shell code).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length')" != "0" ]; then
            echo "Another open PR still references $BRANCH — leaving it."
            exit 0
          fi

          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" || echo "Branch already gone."
