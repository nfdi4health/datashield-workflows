name: Dispatch runner
description: >
  Starts a workflow of the runner repository (a workflow_dispatch there):
  the implementer, which then works through the approved issues, or the
  researcher. With an App's client ID and key it makes a token for that
  repository only, with Actions permission only; otherwise it uses the
  token given. `fields` are passed as the run's inputs.

inputs:
  repository:
    description: 'The runner repository, owner/name.'
    required: true
  workflow:
    description: 'The runner workflow file.'
    required: false
    default: 'implement-issue.yml'
  ref:
    description: 'The branch the runner workflow runs on.'
    required: false
    default: 'main'
  app-client-id:
    description: 'Client ID of an App installed on the runner repository with Actions: read and write.'
    required: false
    default: ''
  app-private-key:
    description: 'Its private key.'
    required: false
    default: ''
  token:
    description: 'Otherwise: a token that may start workflows in the runner repository.'
    required: false
    default: ''
  fields:
    description: 'Inputs passed to the runner workflow, one "name=value" per line (e.g. the researcher''s mode). Empty: none, as for the implementer, which reads its work from the labels.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Split the repository name
      id: repo
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
      run: |
        [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "Not owner/name: $REPOSITORY" >&2; exit 1; }
        echo "owner=${REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
        echo "name=${REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

    - name: Token for the runner repository
      id: app
      if: inputs.app-client-id != ''
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ steps.repo.outputs.owner }}
        repositories: ${{ steps.repo.outputs.name }}
        permission-actions: write

    - name: Start the runner
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token || inputs.token }}
        REPOSITORY: ${{ inputs.repository }}
        WORKFLOW: ${{ inputs.workflow }}
        REF: ${{ inputs.ref }}
        FIELDS: ${{ inputs.fields }}
      run: |
        [ -n "$GH_TOKEN" ] || { echo "No App and no token for the runner repository." >&2; exit 1; }
        args=()
        while IFS= read -r line; do
          line="$(sed 's/^ *//; s/ *$//' <<< "$line")"
          [ -n "$line" ] || continue
          [[ "$line" == *=* ]] || { echo "Not name=value: $line" >&2; exit 1; }
          args+=(-f "$line")
        done <<< "$FIELDS"
        gh workflow run "$WORKFLOW" --repo "$REPOSITORY" --ref "$REF" "${args[@]}"
        echo "Started $WORKFLOW in $REPOSITORY."
