project:
  type: website
  output-dir: _site

shortcodes:
  - _shortcodes/workflow.lua

website:
  title: "datashield-workflows"
  description: "Reusable GitHub Actions workflows for R packages and DataSHIELD analysis projects"
  repo-url: https://github.com/nfdi4health/datashield-workflows
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    right:
      - icon: github
        href: https://github.com/nfdi4health/datashield-workflows
        aria-label: GitHub repository
  sidebar:
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: Home
      - section: "Getting started"
        href: getting-started.qmd
        contents:
          - overview.qmd
          - branch-protection.qmd
      - section: "Pull request checks"
        contents:
          - r-cmd-check.qmd
          - commitlint.qmd
          - require-head-branch.qmd
      - section: "Release"
        contents:
          - release.qmd
          - package-release.qmd
          - merge-pull-request.qmd
          - create-issue.qmd
          - trigger-release-publish.qmd
      - section: "Bot suggestions"
        contents:
          - suggestions.qmd
          - authors-suggest.qmd
          - roxygen-suggest.qmd
          - section: "Test suggestions"
            href: test-suggest.qmd
            contents:
              - test-suggest-review.qmd
              - test-suggest-datashield.qmd
          - claude-setup.qmd
          - cleanup-suggestion-branch.qmd
          - section: "Under the hood"
            href: suggestions-internals.qmd
            contents:
              - suggestions-internals-roxygen.qmd
              - suggestions-internals-tests.qmd
      - section: "Analysis projects"
        contents:
          - section: "DataSHIELD analysis scripts"
            href: datashield-analysis-suggest.qmd
            contents:
              - datashield-analysis-details.qmd
      - section: "Workflow upkeep"
        contents:
          - workflow-keepalive.qmd
          - section: "Workflow graphs"
            href: workflow-graphs.qmd
            contents:
              - workflow-graphs-details.qmd
      - roadmap.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    code-copy: true
    code-overflow: wrap
    mermaid:
      theme: neutral
