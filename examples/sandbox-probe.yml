name: Sandbox Probe

# In the runner repository of the implementer: checks once, by hand, that
# the agent's sandbox blocks unlisted hosts and shows no token. One short
# call on the subscription.
on:
  workflow_dispatch:

concurrency:
  group: claude-subscription
  cancel-in-progress: false

jobs:
  probe:
    permissions:
      contents: read
    uses: nfdi4health/datashield-workflows/.github/workflows/sandbox-probe.yml@main
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
