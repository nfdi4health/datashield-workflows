name: Test Suggestions

on:
  pull_request:
    branches: [dev]
    paths: ['R/**']
  # Optional: also on pushes to your working branches (main left out).
  # push:
  #   branches-ignore: [main]
  #   paths: ['R/**']
  schedule:
    - cron: '0 7 1 * *'   # monthly: what changed on dev since the last review
  workflow_dispatch:
    inputs:
      scope:
        description: 'changed: what changed since the last review; all: every R file (a full review)'
        type: choice
        options: [changed, all]
        default: changed

jobs:
  suggest-tests:
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      actions: read    # earlier runs: where the last review ended
      checks: read     # their annotations
    uses: nfdi4health/datashield-workflows/.github/workflows/test-suggest.yml@main
    # Every run reviews what changed since the last review: PR or push, the
    # schedule (on dev), or a manual run (on the branch chosen in "Run
    # workflow"). A manual run with scope "all" reviews every R file.
    with:
      review-scope: ${{ inputs.scope || 'changed' }}
      # DataSHIELD packages only:
      # datashield-type: client   # or server, utility
      # dslite-setup: auto        # create a DSLite test setup only if the tests can't connect yet
    secrets:
      anthropic-organization-id: ${{ secrets.ANTHROPIC_ORG_ID }}
      anthropic-service-account-id: ${{ secrets.ANTHROPIC_SVAC_ID }}
      anthropic-federation-rule-id: ${{ secrets.ANTHROPIC_FDRL_TESTS }}
      app-client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

  keepalive:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    uses: nfdi4health/datashield-workflows/.github/workflows/workflow-keepalive.yml@main
