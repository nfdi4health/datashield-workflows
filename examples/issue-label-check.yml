name: Issue Label Check

on:
  issues:
    types: [labeled, edited]

jobs:
  check-label:
    permissions:
      issues: write
    uses: nfdi4health/datashield-workflows/.github/workflows/issue-label-check.yml@main
    with:
      label: bot-proceed
      allowed-logins: your-login   # exact GitHub logins, separated by commas or spaces
      # Optional: start the implementer once an approval stays.
      # runner-repository: your-login/your-agent-runner
    # secrets:
    #   app-client-id: ${{ secrets.APP_CLIENT_ID }}   # the bots' App, with Actions: read and write, installed on the runner repository
    #   app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
