name: Release

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    if: github.head_ref == 'dev'
    uses: nfdi4health/datashield-workflows/.github/workflows/r-cmd-check.yml@main
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # For a package on CRAN (optional): no release before the waiting time
  # since the last CRAN submission is over (cran-hotfix label: an urgent
  # fix may go earlier). Add it to on-success's `needs` and `if`.
  # cran-waiting-time:
  #   if: github.head_ref == 'dev'
  #   permissions:
  #     contents: read
  #   uses: nfdi4health/datashield-workflows/.github/workflows/cran-wait-check.yml@main
  #   with:
  #     min-days: 60   # 90: quarterly

  # Writes `Closes #n` for each issue labelled next-release into this pull
  # request's description, so the merge closes them.
  link-issues:
    if: github.head_ref == 'dev'
    uses: nfdi4health/datashield-workflows/.github/workflows/release-issues.yml@main
    with:
      step: link

  on-success:
    needs: [check, link-issues]
    if: needs.check.result == 'success' && needs.link-issues.result == 'success'
    uses: nfdi4health/datashield-workflows/.github/workflows/merge-pull-request.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}

  on-failure:
    needs: check
    if: needs.check.result == 'failure'
    uses: nfdi4health/datashield-workflows/.github/workflows/create-issue.yml@main
    with:
      pr_author: ${{ github.event.pull_request.user.login }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  trigger-release:
    needs: on-success
    if: needs.on-success.result == 'success'
    uses: nfdi4health/datashield-workflows/.github/workflows/trigger-release-publish.yml@main

  # After the merge: the closed issues get `released` instead of
  # `next-release`.
  label-released:
    needs: on-success
    if: needs.on-success.result == 'success'
    uses: nfdi4health/datashield-workflows/.github/workflows/release-issues.yml@main
    with:
      step: swap
