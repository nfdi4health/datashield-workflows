name: Literature Watch

# In the hub of missing functions: starts the literature watch in the private
# runner repository (literature-watch.yml there). Only the logins listed may
# start it; the bots' App needs Actions: write on the runner.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pilot (abstract against methods section, a report only)'
        default: pilot
      query:
        description: 'One query of config/literature-watch.yml (empty: all of them)'
        default: ''

jobs:
  start:
    permissions:
      contents: read
    uses: nfdi4health/datashield-workflows/.github/workflows/literature-watch-start.yml@main
    with:
      runner-repository: your-login/your-runner
      mode: ${{ inputs.mode }}
      query: ${{ inputs.query }}
      allowed-logins: your-login
    secrets:
      app-client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
