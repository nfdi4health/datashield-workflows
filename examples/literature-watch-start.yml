name: Literature Watch

# In the hub of missing functions: starts the literature watch in the
# private runner repository (literature-watch.yml there). Only the logins
# listed may start it; the bots' App needs Actions: write on the runner.
on:
  workflow_dispatch:
    inputs:
      field:
        description: 'One field of config/literature-watch.yml (empty: all of them)'
        default: ''
      max-papers:
        description: 'At most this many papers in this run (empty: papers_per_run of config/literature-watch.yml)'
        default: ''

jobs:
  start:
    permissions:
      contents: read
    uses: nfdi4health/datashield-workflows/.github/workflows/literature-watch-start.yml@main
    with:
      runner-repository: your-login/your-runner
      field: ${{ inputs.field }}
      max-papers: ${{ inputs.max-papers }}
      allowed-logins: your-login
    secrets:
      app-client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
