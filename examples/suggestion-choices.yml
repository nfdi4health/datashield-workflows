name: Suggestion Choices

on:
  pull_request:
    types: [edited, closed]   # a checkbox changed; the PR was closed or merged (outcome record)

jobs:
  apply-choices:
    # Only roxygen and test bot PRs; edits only by a person.
    if: >-
      (startsWith(github.head_ref, 'bot-suggest/tests') || startsWith(github.head_ref, 'bot-suggest/docs'))
      && (github.event.action == 'closed' || github.event.sender.type != 'Bot')
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    uses: nfdi4health/datashield-workflows/.github/workflows/suggestion-choices.yml@main
    secrets:
      app-client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
