# In each target repository: the implementer sends this event after a
# 5-hour subscription limit; waiting here, in a public repository, is free.
name: Implementer Timer

on:
  repository_dispatch:
    types: [implementer-timer]

jobs:
  wait:
    permissions: {}
    uses: nfdi4health/datashield-workflows/.github/workflows/implementer-timer.yml@main
    with:
      runner-repository: your-login/your-agent-runner
    secrets:
      dispatch-app-client-id: ${{ secrets.DISPATCH_APP_CLIENT_ID }}
      dispatch-app-private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
