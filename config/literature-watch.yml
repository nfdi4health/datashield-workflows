# Settings for literature-watch.yml, the researcher of the hub for
# missing DataSHIELD functions (dev-notes/issue-agents.md, "A central
# hub"). The hub's own config/literature-watch.yml is merged over this file
# key by key (a list, e.g. queries, is replaced as a whole).

# The fields come from the hub's own file, each a name and the field's
# part of the PubMed search (the search syntax of the PubMed website; MeSH
# headings explode, so broad parent headings marked [majr] are best), e.g.
#   fields:
#     - name: cardiovascular
#       pubmed: '"Cardiovascular Diseases"[majr]'
# The name is the field's key in the data and its section in the report.
# No default here: each hub has its own.

# What every field's search has around its own part: the study design and
# the filters (open-access full text in PMC, no reviews or meta-analyses),
# so no field can forget them. Changing either gives every field a new
# search version (queries.csv) and a fresh sample.
search:
  design: '"Epidemiologic Studies"[MeSH Terms]'
  filters: '"pubmed pmc open access"[filter] NOT (review[pt] OR systematic review[pt] OR meta-analysis[pt])'

# How much is read (a round) and how fast. A round is complete when every
# field has target_per_month papers (or all, if fewer) of every
# publication month of the last years_back years read; raising either
# starts the next round, which reads only the papers not yet read.
sampling:
  target_per_month: 25    # papers per field and publication month
  years_back: 5           # how far back
  lag_months: 2           # the newest month is this many months back (papers arrive late)
  recheck_months: 6       # the newest months are searched again on each run's day
  papers_per_run: 1500    # at most this many papers per run (the manual input max-papers overrides it once)

# Reading: papers per Claude call, and how much of a methods section (its
# statistics subsections first).
reading:
  batch: 5
  max_section_chars: 12000

# Where things go in the hub: the data on its own branch (the workflow's
# input data-branch, pushed by the runs without a pull request:
# papers/YYYY/YYYY-MM.jsonl, months.csv, queries.csv and readers.csv under
# `data`), and the report (overview.md, progress.csv) under `reports` on
# the same branch, written at the end of every run.
files:
  data: literature-watch/data
  reports: literature-watch/reports

# The vocabulary (R/classify_literature.R, after the reading of each run):
# Claude (Opus) sorts the method names the papers gave into methods and
# variants (vocabulary.yml under `data`, written by the workflow, never by
# hand); only names not classified yet are asked about.
vocabulary:
  batch: 60            # names per call
  max_calls: 15        # calls per run for names and variants together

# "Exists in DataSHIELD?": each method (and variant) named in at least
# `min_papers` usable papers is checked against the functions of the
# DataSHIELD packages, from the catalogue's inventory (FederatedMethods/
# packages, which also gives each package's status; retired ones are left
# out). R picks the `candidates` functions sharing most words with the
# method, Claude answers with the function and a quote from its title or
# description, which R checks. Asked again only when those candidates
# change.
exists:
  min_papers: 3
  candidates: 15
  batch: 5             # methods per call
  max_calls: 15
  architectures: [client, other]   # client functions and exported helpers, not server functions
  functions_url: https://raw.githubusercontent.com/FederatedMethods/packages/main/datashield_functions_metadata.json
  packages_url: https://raw.githubusercontent.com/FederatedMethods/packages/main/package_list.csv

# The candidates: once the first round is complete, and then once a month,
# the most used methods (and variants) DataSHIELD lacks (`none` or
# `partial`; `development` doesn't count) are researched by Claude (with
# web search) and proposed to the hub as a pull request, three boxes per
# candidate: open an issue, not now, don't suggest again. Methods with a
# hub issue (open or closed) are left out; a "don't suggest again" comes
# back when its papers reach `resuggest_factor` times the count at the
# decision. The decisions are kept in decisions.yml under `data`.
candidates:
  max: 10               # candidates per pull request
  min_papers: 5         # in the recent years (report$share_years)
  branch_prefix: bot-suggest/literature-watch/candidates
  folder: literature-watch/candidates    # on the hub's main branch, one file per month
  resuggest_factor: 2
  examples: 3           # example papers per candidate

# The report.
report:
  top: 20                 # methods listed per section
  min_variant_papers: 2   # a variant is listed once this many papers name it
  share_years: 3          # methods are ranked by their share over the last years
  chart_methods: 5        # trend charts for the top methods

ncbi:
  base_url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/
  tool: datashield-workflows   # the tool name NCBI asks for; no e-mail is sent
  rate_per_second: 3           # without an API key (NCBI_API_KEY: 10)
