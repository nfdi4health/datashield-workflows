# Settings of issue-triage.yml. The gate (.github/actions/issue-triage-gate)
# knows the keys `needs-info`, `duplicate`, `spam` and `out-of-scope`: they
# decide who can start another triage, so keep them.

# Category -> label: its name in the comment; github_label: the label set
# on the issue (empty: none; a label the repository lacks is created by
# GitHub); meaning: what it means for Claude.
categories:
  bug:
    label: Bug
    github_label: bug
    meaning: Something that exists does not work as documented or expected, and the report says enough to look into it.
  idea:
    label: Idea
    github_label: enhancement
    meaning: A request for something new or for a change, plausible for this repository.
  question:
    label: Question
    github_label: question
    meaning: Someone wants to know how something works; nothing has to change.
  duplicate:
    label: Duplicate
    github_label: duplicate
    meaning: One of the listed issues, open or recently closed, asks for the same thing.
  needs-info:
    label: More information needed
    github_label: needs-info
    meaning: It may be a real bug or idea, but it cannot be judged without more detail.
  out-of-scope:
    label: Out of scope
    github_label: out-of-scope
    meaning: A real request, but it does not belong in this repository.
  spam:
    label: Spam
    github_label: invalid
    meaning: Advertising, nonsense or anything else that is not a real issue.

max_body_chars: 20000    # of the issue body, sent to Claude
max_reply_chars: 8000    # of all comments, the newest kept, sent to Claude
max_closed_issues: 30    # the most recently closed issues listed next to the open ones (0: none; at most 100)
shortlist_body_chars: 1000     # of each other issue's text, for the shortlist (title plus its start)
max_related_issues: 5          # shortlisted issues the triage reads in full
max_related_chars: 8000        # of each one: body (at most a third) and comments, the newest kept
max_documented_functions: 3    # functions the issue is about whose roxygen documentation the triage reads
max_documentation_chars: 6000  # of each one's documentation
# DESCRIPTION fields the triage reads, for missing dependencies.
description_fields: [Package, Depends, Imports, LinkingTo, Suggests, Remotes]

# How the report compares with the documentation, as the comment words it
# (empty: no line). The keys are the tool's enum.
documentation_verdicts:
  contradicts: the report contradicts what the function is documented to do
  matches: the reported behaviour is what the function is documented to do
  not_covered: the documentation doesn't cover the reported behaviour
  none: ""
max_text_chars: 400      # of each text field in the comment
max_missing_items: 3
max_spec_items: 6        # points in each list of the spec
spec_categories: [bug, idea]   # these get a spec in their comment

suspicious_label: bot-suspicious   # set when Claude finds an attempt to steer it
triaged_label: bot-triaged         # set on every triaged issue, so "triaged, waiting for a decision" can be filtered (empty: none)

# DataSHIELD repositories (input `datashield: true`): the spec of these
# categories gets a disclosure section when the change touches what a
# server function returns or creates, with the settings that apply, taken
# from the list at `settings_path` in `settings_file` (a config file of
# this repository, merged like the others). Bugs keep the existing
# disclosure, so they get none.
disclosure:
  categories: [idea]
  settings_file: config/ds-package-rules.yml
  settings_path: [function, server, disclosure, settings]

footer: Automatic first look. Nothing has been decided.
# %s is "1 place" or "2 places".
hidden_text_note: "this issue has text that is hidden on the page, in %s. Open the raw text to read it before relying on this."

# The spec's "Affects" line, with a server package (input `server`).
affects:
  this: this repository only
  both: "this repository and `{{SERVER}}`"
  server: "only `{{SERVER}}` (then the issue belongs there)"

# Under a spec with open questions: answers in a comment start a new triage.
open_questions_note: "_Answer the open questions in a comment (the issue's author or a maintainer): that starts a new triage._"
