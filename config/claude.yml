# Claude call settings per task: model, tokens, thinking, tool name. The
# rules of what gets proposed and reported are in
# config/suggestion-policy.yml. A project's own config/claude.yml is merged
# over this file key by key; a profile is merged over `default`.

# What some models reject, for claude_settings() / adapt_to_model(): a
# profile, or a caller's `model` input, can name any model, and its
# settings are fitted to it (tool_choice auto, adaptive thinking, no
# server-side fallback, no effort). A model in no list is sent as the profile says.
# Extend the lists when new models come out.
model_rules:
  no_forced_tool_choice: [claude-opus-5-5, claude-sonnet-5-5, claude-fable-5-1, claude-mythos-5-1]
  no_disabled_thinking: [claude-opus-5-5, claude-sonnet-5-5, claude-fable-5, claude-fable-5-1, claude-mythos-5, claude-mythos-5-1]
  server_side_fallbacks: [claude-fable-5-1, claude-opus-5-5, claude-opus-5, claude-sonnet-5-5]
  no_effort: [claude-haiku-4-5, claude-sonnet-4-5]

default:
  anthropic:
    model: claude-sonnet-5
    max_tokens: 4096
    api_version: "2023-06-01"
    thinking:
      type: disabled
    tool_choice_type: tool

roxygen-review:
  anthropic:
    tool_name: submit_review
    max_tokens: 8192   # room for reasoning on possible bugs and judging earlier findings

test-review:
  anthropic:
    tool_name: submit_tests
    model: claude-opus-5
    max_tokens: 32000
    thinking:
      type: adaptive
    effort: high
    fallbacks: default
    betas: [server-side-fallback-2026-07-01]
    # The shared part of the prompt is cached (dev-notes/claude-costs.md);
    # default 5 minutes. "1h" only if a run's calls start > 5 min apart.
    # cache_ttl: 1h
    # To try Claude Opus 5.5 (cheaper; rejects forced tool calls, so the
    # tool is sent strict with tool_choice auto, see call_claude_tool()):
    # model: claude-opus-5-5
    # tool_choice_type: auto
    # (keep thinking adaptive and effort high; same for
    # test-failure-classification)

datashield-analysis:
  anthropic:
    tool_name: submit_analysis_scripts
    model: claude-opus-5
    max_tokens: 32000
    thinking:
      type: adaptive
    effort: high
    fallbacks: default
    betas: [server-side-fallback-2026-07-01]

# DataSHIELD argument naming: classifies arguments the code can't place
# (role, object class). Small, checkable answers; a person approves every
# rename, so the cheaper model.
ds-naming-classification:
  anthropic:
    tool_name: submit_naming_classification
    max_tokens: 4096

test-failure-classification:
  anthropic:
    tool_name: submit_failure_classification
    model: claude-opus-5
    max_tokens: 16000
    thinking:
      type: adaptive
    effort: high
    fallbacks: default
    betas: [server-side-fallback-2026-07-01]

# First look at a new issue; a person decides everything that follows.
# Sonnet 5.5 for the spec of bugs and ideas, the implementer's only source
# (user's choice, 2026-11-09). It rejects forced tool calls and needs
# thinking, see call_claude_tool().
issue-triage:
  anthropic:
    tool_name: submit_triage
    model: claude-sonnet-5-5
    tool_choice_type: auto
    thinking:
      type: adaptive
    effort: medium
    max_tokens: 8192   # thinking plus the spec
