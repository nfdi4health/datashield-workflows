# Settings for datashield-analysis-suggest.yml. A project can change them
# with its own file at the same path (config/analysis-suggest.yml) that
# holds only the entries to change; it is merged over these defaults, key
# by key (a list, e.g. package_status, is replaced as a whole).
# The analysis plan itself is a different file (config/analysis-plan.yml
# by default, the workflow's plan-file input). Wording lives in
# config/analysis-texts.yml.

mock_data:
  rows_per_study: 1000   # synthetic rows per study for the DSLite test run
  missing_share: 0.05    # share of missing values per variable
  seed: 20260930         # same plan, same mock data
  decimals: 2            # continuous values are rounded to this
  folder: bot-suggest    # under paths$mock_data

max_script_lines: 150    # per script file; longer steps are split into 02a_, 02b_, ...
max_file_title_chars: 40 # the step title part of a script's file name is cut to this

numbering:
  first: 2               # 01 is the login
  reserved_from: 90      # numbers from here up are left alone (e.g. 99_DSLiteLearning.R)

repair_rounds: 2         # extra Claude rounds for steps that failed the checks
test_run_timeout_seconds: 1800

# Where things are in a dsAnalysis project. The login files are read from
# the project's config.yml (login_folder / login_file); these are the
# fallbacks if it has none.
paths:
  scripts: R
  main: R/main.R
  dependencies: dependencies.R
  project_config: config.yml
  mock_data: utils/mock_data   # dsAnalysis's update_MockData() expects this folder
  login_production: R/01_DS_Login.R
  login_testing: utils/setup/01_DSLite_Setup.R

# Profile names in the project's config.yml: the real login, and the DSLite
# test setup the test run uses (R_CONFIG_ACTIVE). An interface with the
# dsAnalysis templates.
profiles:
  production: production
  testing: testing

# Marker lines of the blocks the bot maintains in main.R and
# dependencies.R. An interface with the dsAnalysis templates: change both
# together.
markers:
  main_start: "#### bot-suggest: scripts (updated by datashield-analysis-suggest)"
  main_end: "#### bot-suggest: scripts end"
  dependencies_start: "#### bot-suggest: packages (updated by datashield-analysis-suggest)"
  dependencies_end: "#### bot-suggest: packages end"
  # dsAnalysis's own marker in 01_DSLite_Setup.R; the lines above it load
  # the client packages (checked before calling add_dsPackage()).
  dslite_mock_data: "#### Step 2: Import of mock data files"

# Variable types the plan may use, mapped to how mock data is generated
# (continuous: uniform within range; integer: whole numbers within range;
# categorical: one of the categories). Add the wording of your data
# dictionary here.
variable_types:
  continuous: continuous
  numeric: continuous
  decimal: continuous
  integer: integer
  categorical: categorical
  factor: categorical
  binary: categorical

# Default package catalogue, used when the plan has no package-catalogue entry.
package_catalogue: https://packages.datashield.org/packages.json
# The functions of the known DataSHIELD packages (title, description,
# client/server). For now in FlorianSchw/packages; intended to move to
# FederatedMethods/packages (PR open).
function_catalogue: https://raw.githubusercontent.com/FlorianSchw/packages/main/datashield_functions_metadata.json
client_suffix: Client    # dsBase -> dsBaseClient

# Which catalogue packages may be suggested as "possible with another
# package", by their status in the catalogue: production, development,
# unknown (no status given) or retired. Only affects suggestions, never
# the packages the studies have installed. The plan can override it with
# its own package-status list.
package_status: [production]

# Installed functions Claude must not use, each with the reason it is
# told (written into the prompt). A step that needs one gets a
# limitation note instead. A project's own config can add one, or allow
# one again with `name: ~` (merged key by key).
excluded_functions:
  datashield.login: the login has already run
  datashield.logout: the session stays open for the later scripts
  ds.glmSLMA: study-level meta-analysis isn't available in the test environment; fit pooled models with ds.glm()
  ds.forestplot: forest plots aren't available in the test environment

# Rules for clean scripts, written into the prompt as a list (a project's
# own config replaces the list). From the first trial runs: scripts
# printed classes and column names, copied columns into single vectors,
# hedged with fallbacks and recomputed what DataSHIELD returns.
code_style:
  - "Write only code the step needs. No calls that only look at something (classes, column names, dimensions, levels): you can't see their output, and the analyst doesn't need it in the script."
  - "Use the data frame's columns directly (\"D$bmi\"). Don't copy a column into a separate server-side vector unless a function can't take the column."
  - "Every object you create, on the servers or in R, must be used later in this or another step, or written to an output file."
  - "Take what DataSHIELD functions return (e.g. ds.glm() with CI gives odds-ratio limits) instead of recomputing it."
  - "No defensive fallbacks for elements that 'may be missing': the installed versions are known and tested."
  - "Repeated table code goes into one small helper function, defined once."
  - "Don't add outputs the step doesn't ask for. If you leave out something it asks for, say so in a note."

# Functions that only look at something: an unassigned top-level call to
# one of them is reported as a problem and goes to the repair round.
inspection_functions: [ds.class, ds.colnames, ds.dim, ds.levels, ds.length, ds.ls, ds.names, ds.isNA, ds.exists]

# How the scripts are drafted. agent (default): Claude Code writes each
# step and can try its code in DSLite before answering (subscription or
# WIF). calls: one Messages API call per step and repair round (WIF only).
# With a subscription token (claude-code-oauth-token) it is always agent.
engine: agent

agent:
  max_turns: 40            # per step and round; the agent stops there
  timeout_minutes: 20      # per step and round
  model: ""                # empty: the datashield-analysis profile's model
  effort: ""               # empty: the profile's effort

# A line in the real login file matching this is reported as a possible
# plain-text credential (case-insensitive; comments are ignored).
credential_pattern: '(password|pwd|passwd|token|secret)\s*=\s*["''][^"'']+["'']'

# Repository the "Open issue" links for missing functions point to. Its
# open issues on missing functions (title as in texts$issue$title) are
# shown to Claude, so a gap already requested links to that issue instead
# of offering a new one; at most this many, newest first.
gap_issue_repo: nfdi4health/datashield-workflows
gap_issues_max: 200
