# DataSHIELD naming rules for packages in general: function names and test
# file names. Function arguments: ds-naming-argument-rules.yml.
# A list of candidates under a rule = still open, the first one is used.
# A project's own copy is merged over this file key by key.

meta:
  version: 0.1.0
  status: draft

function:
  case: camelCase
  client:
    pattern: "^ds\\.[a-z][A-Za-z0-9]*$"
    allowed_prefixes: [dh., dss] # discussion: should be removed
    namespaced: ["ds.vert.", "ds.imaging."] # discussion: should be removed
  server:
    pattern: "^[a-z][A-Za-z0-9]*DS$"
  internal:
    prefix: [".", "int."] # discussion: only "." sometimes caused problems
  one_function_per_file: true
  file_name: "<function>.R"

tests:
  pattern: "^test-(<category>-)?<function>(-<variant>)?\\.R$"
  examples:
    simple: test-ds.mean.R
    extended: test-smk_expt-ds.mean-factor_missing.R
  category_joiner: "_"
  category:
    smk: smoke test, function runs and returns expected structure
    arg: argument validation and error messages
    perf: performance against a stored profile
    disc: disclosure checks
    discctrl: disclosure control settings (nfilter.*)
    datachk: data checks / class consistency
    expt: expected results against known values
    math: mathematical correctness
    dgr: degraded or unusual input (missing values, edge cases)
  qualifier:
    bug: regression test for a reported bug
  variant: "[a-z0-9_]+"
  helpers_allowed: ["setup.R", "teardown.R", "^helper-.*\\.R$"]
