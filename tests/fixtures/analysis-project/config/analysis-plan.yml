# Self-test fixture of datashield-analysis-suggest.yml (tests/self-test/
# make-analysis-project.sh puts it into a project built from dsAnalysis's
# templates). Made-up variables, mock data from this plan; the answers
# are recorded in tests/fixtures/claude-answers/analysis-project.json.

project:
  title: "Self-test: BMI and diabetes"

symbol: D

studies:                          # the server names of dsAnalysis's login templates
  - server: DEMO_OBIBA_1
    packages: {dsBase: "6.3.5"}
  - server: DEMO_OBIBA_2
    packages: {dsBase: "6.3.5"}
  - server: DEMO_OBIBA_3
    packages: {dsBase: "6.3.5"}

package-catalogue: self-test-no-catalogue.json   # not there: no catalogue notes, no network
package-status: [production]
mock-data: plan

# The variables' types, categories and ranges come from config/variables.yml
# (as dsAnalysis's initVariables() writes it); only the roles are added here.
variables:
  - name: DIS_DIAB
    role: outcome
  - name: PM_BMI_CONTINUOUS
    role: exposure
  - name: GENDER
    role: confounder

steps:
  - id: data_management
    title: Data management
    description: "Complete cases for outcome, exposure and confounder."

  - id: descriptives
    title: Descriptive statistics
    description: "Mean BMI per study and pooled; table of DIS_DIAB."

  - id: main_model
    title: Main model
    description: "Logistic regression of DIS_DIAB on BMI and GENDER, pooled and as study-level meta-analysis."
